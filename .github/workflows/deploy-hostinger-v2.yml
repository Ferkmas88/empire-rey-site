name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_BASE: https://empire-rey-site.onrender.com

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 145.223.77.154
          username: u923792465
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          source: "dist/*"
          target: /home/u923792465/domains/empireautorey.com/public_html
          strip_components: 1
          rm: true
