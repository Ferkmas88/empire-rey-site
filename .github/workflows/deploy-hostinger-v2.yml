name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy via SSH + rsync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 145.223.77.154
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          port: 22
          script: echo "SSH OK" && ls ~

      - name: Upload via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 145.223.77.154
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          port: 22
          source: ./dist/*
          target: ~/public_html
          strip_components: 1
          overwrite: true
